# =====================================================
# PYTEST.INI - Pytest Configuration File
# =====================================================
# This is a configuration file for Pytest
# It tells Pytest how to run tests and what settings to use

[pytest]
# addopts: Additional options that Pytest should use when running
# --alluredir=reports/allure-results: Save Allure report data to this folder
# Allure generates beautiful HTML reports showing test results
addopts = --alluredir=reports/allure-results

# testpaths: Where Pytest should look for test files
# It will only run tests found in the "tests" folder
testpaths = tests